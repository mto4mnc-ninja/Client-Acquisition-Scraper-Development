name: Training opportunities (daily)

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 11:17 UTC, Mon-Fri (after SAM.gov's overnight extract)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all sources
        run: python -m opportunity_finder.run
      - name: Commit today's results
        run: |
          git config user.name "opportunity-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add opportunity_finder/output
          git diff --cached --quiet || git commit -m "Daily training opportunities $(date -u +%F)"
          git push
